<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebView Test JS Script and Handling URL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #222;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }

        .field {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: monospace;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #0066CC;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:active {
            background: #004499;
        }

        .body-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .body-row input {
            min-width: 0;
        }

        .body-row button {
            width: auto;
            margin-top: 0;
            padding: 0 12px;
            background: #eee;
            color: #222;
        }

        button.secondary {
            background: #fff;
            color: #0066CC;
            border: 1px solid #0066CC;
        }

        button.secondary:active,
        .body-row button:active {
            background: #ddd;
        }

        .status {
            margin-top: 16px;
            font-size: 13px;
            color: #666;
        }

        .status.success {
            color: #2E7D32;
        }

        .status.error {
            color: #C62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebView Test JS Script and Handling URL</h1>

        <div class="grid">
            <div class="field">
                <label for="jsInput">JS Script</label>
                <input id="jsInput" autocapitalize="off" autocorrect="off">
                <div id="bodyRows"></div>
                <button class="secondary" onclick="handleAddBodyRow()">Add message.body field</button>
                <button onclick="handleTriggerScript()">Trigger</button>
            </div>

            <div class="field">
                <label for="urlInput">Handling URL</label>
                <input id="urlInput" autocapitalize="off" autocorrect="off">
                <button onclick="handleTriggerUrl()">Trigger</button>
            </div>
        </div>

        <template id="bodyRowTemplate">
            <div class="body-row">
                <input class="body-key" placeholder="key" aria-label="message.body key" autocapitalize="off" autocorrect="off">
                <input class="body-value" placeholder="value" aria-label="message.body value" autocapitalize="off" autocorrect="off">
                <button aria-label="Remove field" onclick="this.parentElement.remove()">&times;</button>
            </div>
        </template>

        <p class="status" id="statusMessage" role="status"></p>
    </div>

    <script>
        function showStatus(message, type = "") {
            const statusEl = document.getElementById("statusMessage");
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }
        
        function isIOSApp() {
            return !!(window.webkit && window.webkit.messageHandlers);
        }

        function isAndroidApp() {
            return !!window.Android;
        }

        function handleAddBodyRow() {
            const row = document.getElementById("bodyRowTemplate").content.cloneNode(true);
            document.getElementById("bodyRows").appendChild(row);
            document.querySelector("#bodyRows .body-row:last-child .body-key").focus();
        }

        // ponytail: values sent as strings; parse on native side if a number/bool is needed
        function getMessageBody() {
            const body = {};
            document.querySelectorAll("#bodyRows .body-row").forEach(row => {
                const key = row.querySelector(".body-key").value.trim();
                if (key) body[key] = row.querySelector(".body-value").value;
            });
            return body;
        }

        function handleTriggerScript() {
            const name = document.getElementById("jsInput").value.trim().replace(/\(\)$/, "");
            if (!name) return;
            const body = getMessageBody();
            const bodyJson = JSON.stringify(body);

            if (isIOSApp() && window.webkit.messageHandlers[name]) {
                // Swift receives this as message.body
                window.webkit.messageHandlers[name].postMessage(body);
                showStatus(`iOS handler "${name}" triggered, body: ${bodyJson}`, "success");
            } else if (isAndroidApp() && typeof window.Android[name] === 'function') {
                // @JavascriptInterface only takes primitives: no fields -> name(), with fields -> name(String json)
                if (Object.keys(body).length) window.Android[name](bodyJson);
                else window.Android[name]();
                showStatus(`Android handler "${name}" triggered, body: ${bodyJson}`, "success");
            } else {
                showStatus(`Native handler "${name}" not found`, "error");
            }
        }

        function handleTriggerUrl() {
            const path = document.getElementById("urlInput").value.trim();
            if (!path) return;
            // 404.html reads this for its Back button
            try { sessionStorage.setItem("homeUrl", window.location.href); } catch (e) {}
            // strip trailing "/" or "/index.html" so the path lands next to the page, not inside the file
            const base = window.location.origin + window.location.pathname.replace(/\/([^/]*\.html)?$/, '');
            window.location.href = base + (path.startsWith('/') ? path : '/' + path);
        }

        window.addEventListener("load", function() {
            if (isIOSApp()) showStatus("Connected: iOS");
            else if (isAndroidApp()) showStatus("Connected: Android");
            else showStatus("Browser mode (no native bridge)");
        });
    </script>
</body>
</html>
